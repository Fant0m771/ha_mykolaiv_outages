blueprint:
  name: Mykolaivoblenergo outage notifications
  description: >-
    Notifications for one queue of the Mykolaivoblenergo Outages integration:
    a warning before a scheduled outage, power lost and restored, tomorrow's
    schedule published and schedule changes. Send them anywhere (Telegram,
    phone, several channels) with the actions you choose, using
    {{ title }} and {{ message }}.

    Сповіщення для однієї черги: попередження перед відключенням, зникнення та
    відновлення світла, графік на завтра та зміни графіка. Надсилайте куди
    завгодно (Telegram, телефон) діями з {{ title }} і {{ message }}.
  domain: automation
  source_url: https://github.com/Fant0m771/ha_mykolaiv_outages/blob/main/blueprints/automation/mykolaiv_outages/notifications.yaml
  input:
    power_entity:
      name: Power
      description: >-
        The queue's "Power" binary sensor (Електропостачання), and optionally
        "Power (emergency queue)" (Електропостачання (аварійна черга)) to be
        told about emergency outages too.
      selector:
        entity:
          multiple: true
          filter:
            - integration: mykolaiv_outages
              domain: binary_sensor
              device_class: power
    next_outage_entity:
      name: Next outage
      description: The queue's "Next outage" sensor (Наступне відключення).
      selector:
        entity:
          filter:
            - integration: mykolaiv_outages
              domain: sensor
              device_class: timestamp
    schedule_entity:
      name: Schedule events
      description: The queue's "Schedule" event entity (Графік).
      selector:
        entity:
          filter:
            - integration: mykolaiv_outages
              domain: event
    notify_actions:
      name: Send notification
      description: >-
        Actions that deliver each notification. Use {{ title }} and
        {{ message }} in them, e.g. telegram_bot.send_message to a chat or
        channel, or notify.mobile_app_<your phone>.
        Дії для надсилання; використовуйте {{ title }} і {{ message }}.
      selector:
        action: {}
    own_power_entity:
      name: Your power sensor
      description: >-
        Optional. A sensor that sees the grid itself, such as an inverter's
        grid input (on = power). When it says the power is already off, the
        warning before an outage is not sent; while it is on, the warning is
        sent even if the operator already reports an outage. When the operator
        reports power lost or restored later than this sensor saw it, that
        duplicate is not sent either (emergency outages still are). Without it,
        the operator's Power status decides.
        Необов'язково: власний сенсор світла (наприклад, вхід мережі інвертора).
      default: ""
      selector:
        entity:
          filter:
            - domain: binary_sensor
    lead_minutes:
      name: Warn before an outage (minutes)
      description: 0 turns the warning off.
      default: 15
      selector:
        number:
          min: 0
          max: 180
          step: 5
          unit_of_measurement: min
    notify_power:
      name: Power lost and restored
      default: true
      selector:
        boolean: {}
    notify_tomorrow:
      name: Tomorrow's schedule published
      default: true
      selector:
        boolean: {}
    notify_changes:
      name: Schedule changes
      default: true
      selector:
        boolean: {}

mode: queued
max: 5

trigger_variables:
  next_outage_entity: !input next_outage_entity
  lead_minutes: !input lead_minutes

triggers:
  - trigger: template
    id: soon
    value_template: >-
      {% set start = states(next_outage_entity) | as_datetime(none) %}
      {{ lead_minutes | int(0) > 0 and start is not none
         and now() >= start - timedelta(minutes=lead_minutes | int(0))
         and now() < start }}
  - trigger: state
    id: power_off
    entity_id: !input power_entity
    from: "on"
    to: "off"
  - trigger: state
    id: power_on
    entity_id: !input power_entity
    from: "off"
    to: "on"
  - trigger: state
    id: schedule
    entity_id: !input schedule_entity

variables:
  notify_power: !input notify_power
  notify_tomorrow: !input notify_tomorrow
  notify_changes: !input notify_changes
  power_entities: !input power_entity
  own_power_entity: !input own_power_entity
  # No "outage soon" while the power is already off (an earlier or emergency
  # outage). Your own sensor decides first; the operator's status only without it.
  power_already_off: >-
    {% set own = states(own_power_entity) if own_power_entity else 'unknown' %}
    {% if own in ['on', 'off'] %}
      {{ own == 'off' }}
    {% else %}
      {% set entities = [power_entities] if power_entities is string else power_entities %}
      {{ entities | select('is_state', 'off') | list | count > 0 }}
    {% endif %}
  # The operator reports power lost or restored after your own sensor already
  # saw it: a duplicate, except an emergency outage, which says what happened.
  own_power_saw_it: >-
    {% set own = states(own_power_entity) if own_power_entity else 'unknown' %}
    {{ trigger.id in ['power_off', 'power_on'] and own in ['on', 'off']
       and own == trigger.to_state.state
       and trigger.to_state.attributes.source != 'emergency' }}
  # Only real events: not the entity becoming available or being restored.
  is_event: >-
    {{ trigger.id == 'schedule' and trigger.from_state is not none
       and trigger.from_state.state != 'unavailable'
       and trigger.to_state.state not in ['unavailable', 'unknown'] }}
  event_type: "{{ trigger.to_state.attributes.event_type if is_event else '' }}"
  event_day: "{{ trigger.to_state.attributes.day if is_event else '' }}"
  event_schedule: "{{ trigger.to_state.attributes.schedule if is_event else '' }}"
  # A manual "Run actions" has no trigger id: send a test message.
  title: >-
    {%- if trigger.id is not defined -%} 🧪 Перевірка сповіщень
    {%- elif trigger.id == 'soon' and not power_already_off -%} ⚡ Скоро відключення
    {%- elif trigger.id == 'power_off' and notify_power and not own_power_saw_it -%} 🔌 Світло зникло
    {%- elif trigger.id == 'power_on' and notify_power and not own_power_saw_it -%} 💡 Світло є
    {%- elif notify_tomorrow and event_type == 'schedule_published' and event_day == 'tomorrow' -%} 📅 Графік на завтра
    {%- elif notify_changes and event_type == 'schedule_changed' -%} 📅 Графік на {{ 'сьогодні' if event_day == 'today' else 'завтра' }} змінено
    {%- elif notify_changes and event_type == 'schedule_published' and event_day == 'today' -%} 📅 Графік на сьогодні опубліковано
    {%- endif -%}
  message: >-
    {%- set start = states(next_outage_entity) | as_datetime(none) -%}
    {%- if trigger.id is not defined -%} Сповіщення про відключення світла працюють.
    {%- elif trigger.id == 'soon' and start is not none -%} Відключення о {{ as_local(start).strftime('%H:%M') }} (через {{ ((start - now()).total_seconds() / 60) | round(0) | int }} хв).
    {%- elif trigger.id == 'power_off' and trigger.to_state.attributes.source == 'emergency' -%} Аварійне відключення ({{ trigger.to_state.attributes.switched_off | join(', ') }}). Час відновлення не публікується.
    {%- elif trigger.id == 'power_off' -%} Обленерго повідомляє про відключення вашої черги.
    {%- elif trigger.id == 'power_on' -%} Обленерго повідомляє про відновлення електропостачання.
    {%- else -%} {{ event_schedule }}
    {%- endif -%}

conditions:
  - condition: template
    value_template: "{{ title | trim != '' }}"

actions: !input notify_actions
